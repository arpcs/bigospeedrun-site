name: Validate binary race (fork only)
on:
  push:
    branches: [validate-binary-polynomial-race]
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'arpcs/bigospeedrun-site'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: '--max-old-space-size=1536 --v8-pool-size=1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: cdbc2e4a808ff4562a21e1f62e9d7673b4c98040
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type check
        run: npm run check
      - name: Full test suite
        run: npm test
      - name: Production build
        run: npm run build
